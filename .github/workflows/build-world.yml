# Downloads open map data for a real-world simulator area and commits it to the repository.
# (Runs on GitHub, which can reach the data servers.)
name: Build real-world map

on:
  workflow_dispatch:
    inputs:
      name: { description: "World name", default: "lasham" }
      lat: { description: "Latitude of the centre", default: "51.1872" }
      lon: { description: "Longitude of the centre", default: "-1.0335" }
      size_km: { description: "Size (km)", default: "40" }
  push:
    branches: [main]
    paths: ["tools/build_world.py", ".github/workflows/build-world.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python -m pip install numpy pillow
      - name: Build the world
        run: python tools/build_world.py "${{ inputs.name || 'lasham' }}" "${{ inputs.lat || '51.1872' }}" "${{ inputs.lon || '-1.0335' }}" "${{ inputs.size_km || '40' }}"
      - name: Commit the data
        run: |
          git config user.name "world-builder[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/aircraft_foundry/simulator/worlds
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Real-world map data: ${{ inputs.name || 'lasham' }}"
          # main may have moved while the map was building: rebase onto it, then push (a few tries)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
