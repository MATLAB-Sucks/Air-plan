name: Build portable USB edition

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel        # last Intel runner (supported until Aug 2027); app also runs on Apple Silicon via Rosetta
            lock: requirements/lock-macos-intel-py311.txt
            artifact: mac
          - os: windows-latest
            lock: requirements/lock-windows-x64-py311.txt
            artifact: windows
    runs-on: ${{ matrix.os }}
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      NUMBA_DISABLE_TBB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (wheels only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -r ${{ matrix.lock }}
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=8" "pyinstaller==6.16.0" "tbb" || python -m pip install "pytest>=8" "pyinstaller==6.16.0"

      - name: Build application (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! pyinstaller --noconfirm packaging/aircraft_foundry.spec > pyinstaller.log 2>&1; then
            msg=$(tail -40 pyinstaller.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=PyInstaller failed::$msg"
            exit 1
          fi

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PyInstaller may trigger 0xc0000374 (heap corruption) on Windows during Python
          # process teardown even when the build succeeded, so success = the executable exists.
          # PyInstaller's output is saved; on failure its last lines are attached to the job as an
          # error annotation (readable through the GitHub API, unlike the raw log).
          $ErrorActionPreference = "Continue"
          pyinstaller --noconfirm packaging/aircraft_foundry.spec *> pyinstaller.log
          $code = $LASTEXITCODE
          if (Test-Path "dist\AircraftFoundry\AircraftFoundry.exe") {
            Write-Host "Build output verified: dist\AircraftFoundry\AircraftFoundry.exe exists (PyInstaller exit $code)."
            exit 0   # GitHub's pwsh wrapper would otherwise exit with PyInstaller's teardown code
          }
          $tail = (Get-Content pyinstaller.log -Tail 40) -join "`n"
          $msg = $tail.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
          Write-Host "::error title=PyInstaller failed (exit $code)::$msg"
          exit 1

      - name: Self-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Aircraft Foundry.app/Contents/MacOS/AircraftFoundry" --self-test'

      - name: Software OpenGL for the self-test (Mesa llvmpipe, test copy only - not shipped)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's Windows runners have no GPU: Windows offers only OpenGL 1.1 and VTK needs 3.2.
          # A throwaway copy of the app gets Mesa's software OpenGL next to it; dist\ stays untouched.
          # Every stage reports what went wrong as an annotation (readable through the API).
          function Fail($what) {
            $msg = ($what | Out-String).Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Host "::error title=Mesa setup failed::$msg"
            exit 1
          }
          $ErrorActionPreference = "Stop"
          try {
            New-Item -ItemType Directory -Force mesa | Out-Null
            $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "af-ci" } `
                     -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest"
            $asset = $rel.assets | Where-Object { $_.name -like "*-release-msvc.7z" } | Select-Object -First 1
            if (-not $asset) { Fail "no *-release-msvc.7z asset in mesa-dist-win $($rel.tag_name)" }
            Write-Host "Downloading $($asset.name)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mesa\mesa.7z"
          } catch { Fail "download: $_" }
          $out = 7z x "mesa\mesa.7z" "-omesa\x" -y 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "7z exit $LASTEXITCODE`n$($out | Select-Object -Last 15 | Out-String)" }
          $gl = Get-ChildItem -Recurse mesa\x -Filter opengl32.dll | Where-Object { $_.FullName -match "x64" } |
                Select-Object -First 1
          if (-not $gl) {
            Fail "no x64 opengl32.dll in the archive. Contents:`n$((Get-ChildItem -Recurse mesa\x -Filter *.dll | Select-Object -First 40 -ExpandProperty FullName) -join "`n")"
          }
          try {
            Copy-Item -Recurse dist\AircraftFoundry selftest-app
            Copy-Item (Join-Path $gl.DirectoryName "*.dll") selftest-app\
          } catch { Fail "copy: $_" }
          Write-Host "Mesa from $($gl.DirectoryName):"
          Get-ChildItem selftest-app\opengl32.dll, selftest-app\libgallium_wgl.dll -ErrorAction SilentlyContinue
          exit 0

      - name: Self-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          # windowed exe has no console: the self-test writes its result to a log file
          $p = Start-Process -FilePath selftest-app\AircraftFoundry.exe -ArgumentList "--self-test","--self-test-log","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) {
            Get-Content selftest.txt
          }
          if ($p.ExitCode -ne 0) {
            $log = if (Test-Path selftest.txt) { (Get-Content selftest.txt -Tail 40) -join "`n" } else { "no self-test log written" }
            $msg = $log.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Host "::error title=Self-test failed (exit $($p.ExitCode))::$msg"
            exit 1
          }

      - name: Archive macOS app (keeps symlinks and permissions)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Aircraft Foundry.app" mac-app.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with: { name: mac, path: mac-app.zip }

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with: { name: windows, path: dist/AircraftFoundry }

  assemble:
    needs: build
    runs-on: macos-15-intel   # macOS so the .app keeps its symlinks/permissions when re-zipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: mac, path: art-mac }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: art-win/AircraftFoundry }
      - name: Assemble USB layout
        run: |
          ditto -x -k art-mac/mac-app.zip art-mac/
          python packaging/assemble_usb.py --windows art-win/AircraftFoundry --mac "art-mac/Aircraft Foundry.app" --out USB
          ditto -c -k --keepParent USB AircraftFoundry-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AircraftFoundry-Portable
          path: AircraftFoundry-Portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: macos-15-intel   # ditto keeps the .app's symlinks and permissions
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mac, path: art-mac }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: art-win/AircraftFoundry }
      - uses: actions/download-artifact@v4
        with: { name: AircraftFoundry-Portable, path: art-usb }
      - name: Package release assets
        run: |
          mkdir release
          cp art-mac/mac-app.zip release/AircraftFoundry-macOS.zip
          (cd art-win && ditto -c -k --keepParent AircraftFoundry ../release/AircraftFoundry-Windows.zip)
          cp art-usb/AircraftFoundry-Portable.zip release/
          (cd release && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes from the changelog
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read() if os.path.exists("CHANGELOG.md") else ""
          m = re.search(r"^## " + re.escape(tag) + r".*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          open("release-notes.md", "w").write(m.group(1).strip() if m else f"Aircraft Foundry {tag}")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Aircraft Foundry ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/AircraftFoundry-Windows.zip
            release/AircraftFoundry-macOS.zip
            release/AircraftFoundry-Portable.zip
            release/SHA256SUMS.txt
